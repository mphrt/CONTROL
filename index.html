<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Equipos Médicos</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9; /* Fondo muy claro y limpio */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #4a6fa5; /* Azul desaturado para el título */
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .container {
            display: grid;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .btn {
            display: block;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #444; /* Texto gris oscuro para mejor contraste sobre pastel */
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
        }

        /* Efectos de interacción */
        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            opacity: 0.85;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        /* Colores Azul Pastel específicos */
        .defib { background-color: #a2d2ff; } /* Azul cielo pastel */
        .anest { background-color: #bde0fe; } /* Azul claro suave */
        .monit { background-color: #caf0f8; } /* Azul cian muy claro */
        .incub { background-color: #d6e2ff; } /* Azul pervinca suave */
        .venti { background-color: #c0fdff; } /* Azul aguamarina pálido */

    </style>
</head>
<body>

    <h1>GESTIÓN DE EQUIPOS MÉDICOS</h1>

    <div class="container">
        <a href="https://mpdesfibrilador.streamlit.app/" class="btn defib" target="_blank">DESFIBRILADOR</a>
        
        <a href="https://mpanestesia1.streamlit.app/" class="btn anest" target="_blank">MÁQUINA DE ANESTESIA</a>
        
        <a href="https://mpmonitorsignosvitales.streamlit.app/" class="btn monit" target="_blank">MONITORES</a>
        
        <a href="https://mpincubadora.streamlit.app/" class="btn incub" target="_blank">INCUBADORAS</a>
        
        <a href="https://mpventiladormecanico.streamlit.app/" class="btn venti" target="_blank">VENTILADORES</a>
    </div>

</body>
</html>
